name: Update PhoneMatch DZ prices

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update Algerian prices
        run: python scripts/update_prices.py

      - name: Commit updated prices
        run: |
          git config user.name "PhoneMatch DZ Bot"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "chore: update Algerian phone prices"
          git push
